<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<style>
  @page {
    size: A4 portrait;
    margin: 0;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: #fff;
  }
  .page {
    width: 210mm;
    height: 297mm;
    page-break-after: always;
    break-after: page;
    padding: 12mm;
    position: relative;
    background: #fff;
  }
  .page-border {
    width: 100%;
    height: 100%;
    border: 1.5px solid #222;
    padding: 14mm;
    position: relative;
  }
</style>
</head>
<body>
  <div class='page'>
    <div class='page-border'>
      <h2>Page 1 Title</h2>
      <p>Testing border layout</p>
    </div>
  </div>
  <div class='page'>
    <div class='page-border'>
      <h2>Page 2 Title</h2>
      <p>Testing border layout on page 2</p>
    </div>
  </div>
</body>
</html>
