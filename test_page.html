<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<style>
  @page {
    size: A4 portrait;
    margin: 15mm;
  }
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
  }
  .page-frame {
    position: fixed;
    top: -5mm;
    left: -5mm;
    right: -5mm;
    bottom: -5mm;
    border: 1.5px solid #222;
    pointer-events: none;
    box-sizing: border-box;
  }
  .content {
    padding: 5mm;
  }
  .page-break {
    page-break-after: always;
  }
</style>
</head>
<body>
  <div class='page-frame'></div>
  <div class='content'>
    <h1>Page 1</h1>
    <p>This is page 1 content.</p>
  </div>
  <div class='page-break'></div>
  <div class='content'>
    <h1>Page 2</h1>
    <p>This is page 2 content.</p>
  </div>
</body>
</html>
